<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yönetim Paneli · Opticalav</title>
<meta name="theme-color" content="#0e100f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0; scrollbar-width: none; }
  .tabs button { white-space: nowrap; padding: 9px 15px; border-radius: 999px; border: 1px solid var(--line); background: none; font-weight: 600; cursor: pointer; color: var(--muted); }
  .tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tabs .badge { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; margin-left: 6px; font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .list { display: grid; gap: 10px; padding-bottom: 60px; }
  .item { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; text-align: left; width: 100%; }
  .item .thumb { width: 64px; border-radius: 8px; }
  .item h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .item .meta { font-size: 13px; color: var(--muted); }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill.warn { background: rgba(233,162,59,.15); color: var(--accent); }
  .pill.ok { background: rgba(127,176,105,.15); color: var(--ok); }
  .pill.bad { background: rgba(224,106,90,.15); color: var(--danger); }
  .order { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .order > summary { list-style: none; cursor: pointer; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .order > summary::-webkit-details-marker { display: none; }
  .order .body { padding: 0 14px 14px; display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
  .order dl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
  .order dt { color: var(--muted); }
  .order dd { margin: 0; word-break: break-word; }
  .imgs { display: flex; flex-wrap: wrap; gap: 8px; }
  .imgs .im { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .imgs .im img { width: 100%; height: 100%; object-fit: cover; }
  .imgs .im button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; cursor: pointer; line-height: 1; }
  .imgs .im .cover { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; text-align: center; background: rgba(0,0,0,.6); }
  .imgs .im.add { display: grid; place-items: center; cursor: pointer; color: var(--muted); font-size: 13px; text-align: center; border-style: dashed; }
  .toggles { display: flex; gap: 18px; flex-wrap: wrap; }
  .hint { background: rgba(233,162,59,.08); border: 1px solid rgba(233,162,59,.3); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .login { max-width: 380px; margin: 60px auto; }
  .sticky-actions { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters select, .filters input { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/" target="_blank">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="16" cy="16" r="9"/><path d="M16 3v8M16 21v8M3 16h8M21 16h8"/></svg>
    <span><b lang="en">Opticalav</b><small>Yönetim paneli</small></span>
  </a>
  <span class="spacer"></span>
  <button class="btn ghost" id="logout" hidden style="min-height:38px;padding:0 14px">Çıkış</button>
</div></header>
<main class="wrap" id="app"><div class="loading">Yükleniyor…</div></main>
<div class="toast" id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
